<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 パステル・ミニゲームランド 🌸</title>
  <meta name="description" content="パステルカラーのかわいいミニゲーム集。おみくじやじゃんけんで遊ぼう！">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #ffd1dc 0%, #d8b4fe 50%, #93c5fd 100%);
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-shadow: 0 20px 40px rgba(160, 130, 200, 0.25);
      --text-main: #4a3b50;
      --text-muted: #85728f;
      --pink-accent: #ff758f;
      --blue-accent: #4361ee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      color: var(--text-main);
      overflow-x: hidden;
      position: relative;
    }

    /* 背景のふわふわ浮遊サークル */
    .floating-bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      filter: blur(10px);
      z-index: 0;
      animation: float 8s infinite ease-in-out alternate;
    }
    .bubble-1 { width: 160px; height: 160px; top: 8%; left: 8%; }
    .bubble-2 { width: 220px; height: 220px; bottom: 8%; right: 6%; animation-delay: 2s; }
    .bubble-3 { width: 100px; height: 100px; top: 70%; left: 10%; animation-delay: 4s; }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-30px) rotate(15deg); }
    }

    /* メインコンテナ */
    .portal-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 820px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 36px;
      padding: 40px 28px;
      box-shadow: var(--card-shadow);
      border: 3px solid rgba(255, 255, 255, 0.95);
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: #ffe4e8;
      color: #ff5d8f;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 6px 20px;
      border-radius: 999px;
      margin-bottom: 14px;
      box-shadow: 0 4px 12px rgba(255, 93, 143, 0.15);
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 900;
      color: #3b2d42;
      margin-bottom: 8px;
      letter-spacing: 0.05em;
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    /* ゲーム選択カードグリッド（2x2） */
    .game-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 580px) {
      .game-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .game-card {
      background: #ffffff;
      border-radius: 28px;
      padding: 24px 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 3px solid transparent;
      box-shadow: 0 10px 25px rgba(150, 130, 180, 0.15);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    .game-card-sprunki {
      border-color: #d8b4fe;
    }
    .game-card-sprunki:hover {
      border-color: #9333ea;
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 16px 35px rgba(147, 51, 234, 0.3);
    }

    .game-card-omikuji {
      border-color: #ffd6e0;
    }
    .game-card-omikuji:hover {
      border-color: #ff758f;
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 16px 35px rgba(255, 117, 143, 0.3);
    }

    .game-card-janken {
      border-color: #d0e1fd;
    }
    .game-card-janken:hover {
      border-color: #4361ee;
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 16px 35px rgba(67, 97, 238, 0.3);
    }

    .game-card-neko {
      border-color: #ede3d1;
    }
    .game-card-neko:hover {
      border-color: #c84b31;
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 16px 35px rgba(200, 75, 49, 0.3);
    }

    .game-icon-box {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.6rem;
      margin-bottom: 14px;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .game-card-sprunki .game-icon-box {
      background: linear-gradient(135deg, #f3e8ff 0%, #d8b4fe 100%);
    }

    .game-card-omikuji .game-icon-box {
      background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
    }

    .game-card-janken .game-icon-box {
      background: linear-gradient(135deg, #e0ecff 0%, #b8d5fd 100%);
    }

    .game-card-neko .game-icon-box {
      background: linear-gradient(135deg, #fceddb 0%, #ede3d1 100%);
    }

    .game-card:hover .game-icon-box {
      transform: scale(1.15) rotate(6deg);
    }

    .game-title {
      font-size: 1.25rem;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .game-desc {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 16px;
      flex-grow: 1;
    }

    .play-btn {
      width: 100%;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 900;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .game-card-sprunki .play-btn {
      background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
      color: #fff;
      box-shadow: 0 6px 15px rgba(147, 51, 234, 0.3);
    }

    .game-card-omikuji .play-btn {
      background: linear-gradient(135deg, #ff85a1 0%, #ff5d8f 100%);
      color: #fff;
      box-shadow: 0 6px 15px rgba(255, 93, 143, 0.3);
    }

    .game-card-janken .play-btn {
      background: linear-gradient(135deg, #4895ef 0%, #4361ee 100%);
      color: #fff;
      box-shadow: 0 6px 15px rgba(67, 97, 238, 0.3);
    }

    .game-card-neko .play-btn {
      background: linear-gradient(135deg, #c84b31 0%, #e06d53 100%);
      color: #fff;
      box-shadow: 0 6px 15px rgba(200, 75, 49, 0.3);
    }

    .footer-note {
      margin-top: 32px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="floating-bubble bubble-1"></div>
  <div class="floating-bubble bubble-2"></div>
  <div class="floating-bubble bubble-3"></div>

  <main class="portal-container">
    <div class="badge">🌸 WELCOME 🌸</div>
    <h1>ミニゲームランド</h1>
    <p class="subtitle">遊びたいゲームをタップして選んでね！✨</p>

    <div class="game-grid">
      <!-- スプランキービートメーカーカード -->
      <a href="sprunki.html" class="game-card game-card-sprunki">
        <div class="game-icon-box">🎧</div>
        <h2 class="game-title">スプランキー・ビート</h2>
        <p class="game-desc">絵と音で自作OC作成＆ブラウザ保存！BPM切替対応の7人編成音楽ミキシング🎵</p>
        <div class="play-btn">
          <span>演奏する</span>
          <span>➔</span>
        </div>
      </a>

      <!-- 吾輩は猫であるゲームブックカード -->
      <a href="neko.html" class="game-card game-card-neko">
        <div class="game-icon-box">🐾</div>
        <h2 class="game-title">吾輩は猫である</h2>
        <p class="game-desc">名無しの猫になって日常を冒険！全5種類の結末を見つけよう📖</p>
        <div class="play-btn">
          <span>冒険を始める</span>
          <span>➔</span>
        </div>
      </a>

      <!-- じゃんけんゲームカード -->
      <a href="janken.html" class="game-card game-card-janken">
        <div class="game-icon-box">✊</div>
        <h2 class="game-title">じゃんけんバトル</h2>
        <p class="game-desc">コンピューターと勝負！勝ち負けの回数もカウントするよ🔥</p>
        <div class="play-btn">
          <span>勝負する</span>
          <span>➔</span>
        </div>
      </a>

      <!-- おみくじゲームカード -->
      <a href="omikuji.html" class="game-card game-card-omikuji">
        <div class="game-icon-box">🌸</div>
        <h2 class="game-title">パステルおみくじ</h2>
        <p class="game-desc">今日の運勢やラッキーアイテムを占おう！大吉が出たらラッキー🎉</p>
        <div class="play-btn">
          <span>占ってみる</span>
          <span>➔</span>
        </div>
      </a>
    </div>

    <div class="footer-note">
      スマホでもパソコンでも楽しめます 🌟
    </div>
  </main>

</body>
</html>
