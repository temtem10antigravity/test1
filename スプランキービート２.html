<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 スプランキー・ビート2（Sprunki Beat 2 & HORROR） 🎧</title>
  <meta name="description" content="画像と音声を自由にアップロードして自分だけのキャラクター（OC）を作れる！通常モード＆裏ホラーモード搭載の音楽ミキシングゲーム！">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Fredoka:wght@600;700;900&family=Creepster&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0c0e17;
      --panel-bg: rgba(22, 26, 44, 0.94);
      --border-glow: rgba(0, 240, 255, 0.3);
      --text-main: #f0f2ff;
      --text-muted: #8b92b3;
      --accent-pink: #ff3377;
      --accent-cyan: #00f0ff;
      --accent-yellow: #ffe600;
      --accent-purple: #9d4edd;
      --accent-green: #06d6a0;
      --accent-blood: #ff0033;
      --beat-speed: 0.46s;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #171d33 0%, #08090f 100%);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
      transition: background 0.5s ease;
    }

    /* ホラーモード時の全体スタイル */
    body.horror-mode {
      background: radial-gradient(circle at 50% 20%, #2b0207 0%, #080102 100%);
      --panel-bg: rgba(28, 10, 14, 0.95);
      --border-glow: rgba(255, 0, 51, 0.5);
      --text-main: #ffebee;
      --text-muted: #d48a93;
    }

    /* ホラー切り替えフラッシュ */
    .screen-flash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #ff0033;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    .screen-flash-overlay.flashing {
      animation: horrorGlitchFlash 0.6s cubic-bezier(0.1, 0.9, 0.2, 1);
    }
    @keyframes horrorGlitchFlash {
      0% { opacity: 0.95; filter: invert(1); }
      30% { opacity: 0.7; filter: contrast(3); }
      60% { opacity: 0.85; filter: hue-rotate(90deg); }
      100% { opacity: 0; }
    }

    /* ヘッダー・ナビ */
    header {
      width: 100%;
      max-width: 1120px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 0 4px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .nav-btn {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-cyan);
      text-decoration: none;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.35);
      padding: 8px 18px;
      border-radius: 20px;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .nav-btn:hover {
      background: rgba(0, 240, 255, 0.25);
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.45);
      transform: translateY(-1px);
    }
    body.horror-mode .nav-btn {
      color: #ff4d6d;
      background: rgba(255, 0, 51, 0.15);
      border-color: rgba(255, 0, 51, 0.4);
    }

    /* ホラーモード切替ボタン */
    .mode-toggle-btn {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 0.9rem;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(135deg, #1f0103 0%, #660708 100%);
      border: 2px solid #ff0033;
      padding: 8px 18px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 18px rgba(255, 0, 51, 0.45);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .mode-toggle-btn:hover {
      transform: scale(1.06) translateY(-2px);
      box-shadow: 0 0 25px rgba(255, 0, 51, 0.8);
    }
    body.horror-mode .mode-toggle-btn {
      background: linear-gradient(135deg, #00f0ff 0%, #0077b6 100%);
      border-color: #00f0ff;
      color: #0b121e;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
    }

    /* BPM コントロールエリア */
    .bpm-control-container {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .bpm-selector {
      display: flex;
      background: rgba(255, 255, 255, 0.08);
      padding: 3px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      gap: 3px;
    }

    .bpm-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 999px;
      font-family: 'Fredoka', 'Zen Maru Gothic', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .bpm-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
    }
    .bpm-btn.active {
      background: linear-gradient(135deg, var(--accent-cyan) 0%, #00b4d8 100%);
      color: #081220;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.65);
      font-weight: 900;
    }
    body.horror-mode .bpm-btn.active {
      background: linear-gradient(135deg, #ff0033 0%, #a4161a 100%);
      color: #ffffff;
      box-shadow: 0 0 16px rgba(255, 0, 51, 0.8);
    }

    .bpm-badge {
      font-family: 'Fredoka', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .beat-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #3a3f58;
      transition: all 0.08s ease;
    }
    .beat-dot.active {
      background: var(--accent-pink);
      box-shadow: 0 0 12px var(--accent-pink);
      transform: scale(1.35);
    }
    body.horror-mode .beat-dot.active {
      background: #ff0000;
      box-shadow: 0 0 15px #ff0000;
    }

    /* メインゲームエリア */
    .game-wrapper {
      width: 100%;
      max-width: 1120px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border-radius: 32px;
      border: 2px solid var(--border-glow);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 35px rgba(0, 240, 255, 0.15);
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      transition: all 0.4s ease;
    }
    body.horror-mode .game-wrapper {
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 45px rgba(255, 0, 51, 0.25);
    }

    /* ===================================================
       スプランキー ステージエリア（通常 ＆ ホラー背景）
       =================================================== */
    .stage-container {
      width: 100%;
      border-radius: 26px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8), 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.12);
      min-height: 310px;
      display: flex;
      align-items: flex-end;
    }
    body.horror-mode .stage-container {
      border-color: rgba(255, 0, 51, 0.4);
    }

    /* 通常ステージ背景画 */
    .stage-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #022338 0%, #04526d 38%, #087f8c 68%, #0ca694 100%);
      z-index: 1;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    body.horror-mode .stage-background {
      opacity: 0;
    }

    /* ホラーステージ背景画（血の満月・赤黒い嵐・枯れ木） */
    .stage-background-horror {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #150002 0%, #3d0006 45%, #660708 75%, #1b0002 100%);
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    body.horror-mode .stage-background-horror {
      opacity: 1;
    }

    .blood-moon {
      position: absolute;
      top: 25px;
      right: 18%;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #ff4d6d 0%, #c9184a 60%, #590d22 100%);
      box-shadow: 0 0 35px rgba(255, 0, 51, 0.8), 0 0 10px #ff758f;
      opacity: 0.9;
    }

    .cloud-layer {
      position: absolute;
      top: 20px;
      width: 100%;
      height: 90px;
      opacity: 0.75;
      background-image: radial-gradient(circle at 50% 100%, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.7) 40%, transparent 70%);
      filter: blur(1px);
    }

    .hills-layer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 160px;
      z-index: 2;
      pointer-events: none;
    }

    .stage-vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 100%, transparent 40%, rgba(0, 0, 0, 0.45) 80%, rgba(0, 0, 0, 0.85) 100%),
                  linear-gradient(to top, rgba(0, 0, 0, 0.6) 0%, transparent 35%);
      z-index: 3;
      pointer-events: none;
    }
    body.horror-mode .stage-vignette {
      background: radial-gradient(ellipse at 50% 100%, transparent 30%, rgba(50, 0, 10, 0.55) 75%, rgba(0, 0, 0, 0.9) 100%),
                  linear-gradient(to top, rgba(130, 0, 20, 0.5) 0%, transparent 45%);
    }

    /* ステージ上の7枠キャラクター並び */
    .stage-characters-grid {
      position: relative;
      z-index: 10;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      padding: 0 12px 14px;
      align-items: flex-end;
    }

    @media (max-width: 860px) {
      .stage-characters-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    @media (max-width: 520px) {
      .stage-characters-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* 個別キャラクタースロット */
    .char-stand-slot {
      height: 270px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      border-radius: 20px;
    }
    .char-stand-slot:hover {
      background: rgba(255, 255, 255, 0.04);
    }
    body.horror-mode .char-stand-slot:hover {
      background: rgba(255, 0, 51, 0.08);
    }

    .char-stand-slot.drag-over {
      background: rgba(0, 240, 255, 0.15);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
      transform: scale(1.04);
    }
    body.horror-mode .char-stand-slot.drag-over {
      background: rgba(255, 0, 51, 0.25);
      box-shadow: 0 0 30px rgba(255, 0, 51, 0.7);
    }

    /* スロット操作ボタン */
    .stand-controls {
      position: absolute;
      top: 6px;
      display: flex;
      gap: 6px;
      z-index: 20;
      opacity: 0;
      transform: translateY(-4px);
      transition: all 0.2s ease;
    }
    .char-stand-slot:hover .stand-controls {
      opacity: 1;
      transform: translateY(0);
    }

    .stand-ctrl-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(15, 17, 28, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .stand-ctrl-btn:hover {
      transform: scale(1.2);
    }
    .stand-ctrl-btn.remove:hover { background: #ff4757; }
    .stand-ctrl-btn.mute.is-muted { background: #ffa502; color: #000; }

    /* キャラクターネームラベル */
    .stand-name-label {
      font-size: 0.72rem;
      font-weight: 900;
      color: #fff;
      background: rgba(0, 0, 0, 0.75);
      padding: 3px 10px;
      border-radius: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 95%;
      margin-top: 4px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      z-index: 15;
    }
    body.horror-mode .stand-name-label {
      background: rgba(40, 0, 5, 0.85);
      border-color: rgba(255, 0, 51, 0.4);
      color: #ffccd5;
    }

    /* ===================================================
       スプランキー 立ち絵スプライト ＆ ビートバウンス
       =================================================== */
    .sprunki-sprite-box {
      width: 100%;
      height: 220px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      position: relative;
    }

    .sprunki-svg-character, .sprunki-img-character {
      width: 100%;
      max-width: 125px;
      height: 215px;
      transform-origin: bottom center;
      transition: transform 0.1s ease;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
    }
    .sprunki-img-character {
      object-fit: contain;
      width: auto;
      max-width: 135px;
    }

    .bouncing .sprunki-svg-character, .bouncing .sprunki-img-character {
      animation: sprunkiBounce var(--beat-speed) infinite ease-in-out alternate;
    }
    body.horror-mode .bouncing .sprunki-svg-character, body.horror-mode .bouncing .sprunki-img-character {
      animation: horrorTwitchBounce var(--beat-speed) infinite ease-in-out alternate;
    }

    @keyframes sprunkiBounce {
      0% { transform: scale(1) translateY(0); }
      100% { transform: scale(1.05, 0.96) translateY(-12px); }
    }

    @keyframes horrorTwitchBounce {
      0% { transform: scale(1) translateY(0) rotate(0deg); }
      50% { transform: scale(1.08, 0.92) translateY(-15px) rotate(1.5deg); }
      100% { transform: scale(0.96, 1.04) translateY(-10px) rotate(-1.5deg); }
    }

    .idle-standby .sprunki-svg-character {
      animation: idleBreathe 2.4s infinite ease-in-out alternate;
      opacity: 0.65;
    }

    @keyframes idleBreathe {
      0% { transform: scale(1) translateY(0); }
      100% { transform: scale(1.02, 0.98) translateY(-4px); }
    }

    .custom-oc-avatar-frame {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      border: 3px solid #fff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      object-fit: cover;
      position: absolute;
      top: 15px;
      z-index: 5;
    }
    body.horror-mode .custom-oc-avatar-frame {
      filter: invert(0.85) hue-rotate(170deg) contrast(1.5) drop-shadow(0 0 10px #ff0033);
      border-color: #ff0033;
    }

    /* 下部：キャラクターパレットトレイ */
    .palette-section {
      background: rgba(14, 16, 26, 0.8);
      border-radius: 24px;
      padding: 18px 16px;
      border: 1px solid rgba(255, 255, 255, 0.09);
    }
    body.horror-mode .palette-section {
      background: rgba(22, 5, 8, 0.85);
      border-color: rgba(255, 0, 51, 0.2);
    }

    .palette-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .palette-title {
      font-size: 1rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .palette-grid {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 8px 4px 14px;
    }

    .palette-grid::-webkit-scrollbar {
      height: 6px;
    }
    .palette-grid::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    /* キャラクターカード（パレット内） */
    .char-card {
      flex: 0 0 88px;
      height: 118px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: grab;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }
    body.horror-mode .char-card {
      background: rgba(255, 0, 51, 0.04);
      border-color: rgba(255, 0, 51, 0.25);
    }

    .char-card:hover {
      transform: translateY(-6px) scale(1.06);
      border-color: var(--accent-cyan);
      box-shadow: 0 10px 22px rgba(0, 240, 255, 0.3);
    }
    body.horror-mode .char-card:hover {
      border-color: #ff0033;
      box-shadow: 0 10px 22px rgba(255, 0, 51, 0.4);
    }

    .char-card:active {
      cursor: grabbing;
      transform: scale(0.96);
    }

    .char-card-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      object-fit: cover;
      margin-bottom: 6px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      background: #171a29;
    }
    body.horror-mode .char-card-icon {
      background: #2b0509;
      border-color: rgba(255, 0, 51, 0.4);
    }

    .char-card-name {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80px;
    }

    .char-card-type {
      position: absolute;
      top: 4px;
      left: 4px;
      font-size: 0.58rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 6px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .char-card-actions {
      position: absolute;
      top: 4px;
      right: 4px;
      display: flex;
      gap: 3px;
      opacity: 0;
      transform: translateY(-3px);
      transition: all 0.2s ease;
    }
    .char-card:hover .char-card-actions {
      opacity: 1;
      transform: translateY(0);
    }
    .char-action-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(18, 20, 32, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 0.7rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .char-action-btn:hover { transform: scale(1.2); }
    .char-action-btn.export:hover { background: var(--accent-cyan); color: #000; }
    .char-action-btn.delete:hover { background: #ff4757; color: #fff; }

    /* 新規OC作成ボタン */
    .create-oc-btn {
      flex: 0 0 88px;
      height: 118px;
      background: linear-gradient(135deg, rgba(255, 51, 119, 0.15) 0%, rgba(157, 78, 221, 0.15) 100%);
      border: 2px dashed var(--accent-pink);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--accent-pink);
      cursor: pointer;
      font-family: inherit;
      font-weight: 900;
      font-size: 0.75rem;
      gap: 6px;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .create-oc-btn:hover {
      background: linear-gradient(135deg, rgba(255, 51, 119, 0.3) 0%, rgba(157, 78, 221, 0.3) 100%);
      transform: translateY(-6px) scale(1.06);
      box-shadow: 0 10px 20px rgba(255, 51, 119, 0.35);
    }
    .create-oc-btn .plus-icon { font-size: 2rem; line-height: 1; }

    /* ファイル読込ボタン */
    .import-oc-btn {
      flex: 0 0 88px;
      height: 118px;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.12) 0%, rgba(6, 214, 160, 0.12) 100%);
      border: 2px dashed var(--accent-cyan);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--accent-cyan);
      cursor: pointer;
      font-family: inherit;
      font-weight: 900;
      font-size: 0.75rem;
      gap: 6px;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .import-oc-btn:hover {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.25) 0%, rgba(6, 214, 160, 0.25) 100%);
      transform: translateY(-6px) scale(1.06);

  <script>
    // --- モード管理（通常 ⇔ ホラー） ---
    let isHorrorMode = false;

    // --- IndexedDB ストレージ管理モジュール ---
    const DB_NAME = "SprunkiBeatDB";
    const DB_VERSION = 1;
    const STORE_NAME = "custom_characters";

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: "id" });
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    async function dbSaveCharacter(char) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        const record = {
          id: char.id,
          name: char.name,
          type: char.type || "OC",
          color: char.color,
          icon: char.icon,
          image: char.image || null,
          rawAudioBuffer: char.rawAudioBuffer || null,
          createdAt: char.createdAt || Date.now()
        };
        const req = store.put(record);
        req.onsuccess = () => resolve(true);
        req.onerror = (e) => reject(e.target.error);
      });
    }

    async function dbLoadCharacters() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = (e) => reject(e.target.error);
      });
    }

    async function dbDeleteCharacter(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        const req = store.delete(id);
        req.onsuccess = () => resolve(true);
        req.onerror = (e) => reject(e.target.error);
      });
    }

    // --- バイナリ変換ヘルパー ---
    function arrayBufferToBase64(buffer) {
      let binary = '';
      const bytes = new Uint8Array(buffer);
      const len = bytes.byteLength;
      for (let i = 0; i < len; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return window.btoa(binary);
    }

    function base64ToArrayBuffer(base64) {
      const binaryString = window.atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    function audioBufferToWavArrayBuffer(buffer) {
      const numChannels = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const format = 1;
      const bitDepth = 16;
      const bytesPerSample = bitDepth / 8;
      const blockAlign = numChannels * bytesPerSample;
      const length = buffer.length * numChannels * bytesPerSample;
      const bufferOut = new ArrayBuffer(44 + length);
      const view = new DataView(bufferOut);

      function writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      }

      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + length, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, format, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * blockAlign, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitDepth, true);
      writeString(view, 36, 'data');
      view.setUint32(40, length, true);

      let offset = 44;
      for (let i = 0; i < buffer.length; i++) {
        for (let channel = 0; channel < numChannels; channel++) {
          let sample = buffer.getChannelData(channel)[i];
          sample = Math.max(-1, Math.min(1, sample));
          sample = (sample < 0 ? sample * 32768 : sample * 32767) | 0;
          view.setInt16(offset, sample, true);
          offset += 2;
        }
      }
      return bufferOut;
    }

    // --- トースト通知表示 ---
    function showToast(message) {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = "toast-item";
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentNode) toast.remove();
      }, 3000);
    }

    // --- スプランキー 通常＆ホラー版 立ち絵SVG生成 ---
    function getSprunkiCharacterSVG(char, isStandby = false, isHorror = false) {
      if (isStandby) {
        if (isHorror) {
          // ホラー待機キャラ（漆黒の影＋赤い発光眼）
          return `
            <svg class="sprunki-svg-character" viewBox="0 0 120 220">
              <path d="M45,130 Q40,180 32,220 L88,220 Q80,180 75,130 Z" fill="#150002" stroke="#4a0007" stroke-width="4"/>
              <rect x="52" y="110" width="16" height="25" rx="5" fill="#1c0003" stroke="#4a0007" stroke-width="3"/>
              <ellipse cx="60" cy="72" rx="44" ry="44" fill="#150002" stroke="#4a0007" stroke-width="4.5"/>
              <!-- 虚無の眼球と赤いピンポイント -->
              <circle cx="44" cy="72" r="14" fill="#000" stroke="#ff0033" stroke-width="2"/>
              <circle cx="76" cy="72" r="14" fill="#000" stroke="#ff0033" stroke-width="2"/>
              <circle cx="44" cy="72" r="4.5" fill="#ff0033"/>
              <circle cx="76" cy="72" r="4.5" fill="#ff0033"/>
              <!-- 黒い血の滴り -->
              <path d="M44,86 L44,102 M76,86 L76,98" stroke="#ff0033" stroke-width="2" stroke-linecap="round"/>
            </svg>
          `;
        }
        // 通常待機キャラ（グレー素体）
        return `
          <svg class="sprunki-svg-character" viewBox="0 0 120 220">
            <path d="M45,130 Q40,180 32,220 L88,220 Q80,180 75,130 Z" fill="#4d5366" stroke="#2b2f3d" stroke-width="4"/>
            <rect x="52" y="110" width="16" height="25" rx="5" fill="#585f75" stroke="#2b2f3d" stroke-width="3"/>
            <ellipse cx="60" cy="72" rx="44" ry="44" fill="#606780" stroke="#2b2f3d" stroke-width="4.5"/>
            <circle cx="44" cy="72" r="14" fill="#ffffff" stroke="#2b2f3d" stroke-width="3.5"/>
            <circle cx="76" cy="72" r="14" fill="#ffffff" stroke="#2b2f3d" stroke-width="3.5"/>
            <circle cx="44" cy="72" r="6.5" fill="#1b1c24"/>
            <circle cx="76" cy="72" r="6.5" fill="#1b1c24"/>
            <circle cx="42" cy="70" r="2" fill="#fff"/>
            <circle cx="74" cy="70" r="2" fill="#fff"/>
            <path d="M53,96 Q60,100 67,96" fill="none" stroke="#2b2f3d" stroke-width="3" stroke-linecap="round"/>
          </svg>
        `;
      }

      // PBM70 または 自作全身画像キャラ
      if (char.id === "pbm70" || (char.image && char.fullBody !== false)) {
        const imgSrc = char.image || "character_transparent.png";
        return `
          <div class="sprunki-sprite-box">
            <img src="${imgSrc}" class="sprunki-img-character" alt="${char.name}">
          </div>
        `;
      }

      // 自作OC画像（アバター型）の場合
      if (char.image) {
        const bodyColor = isHorror ? "#4a0008" : (char.color || "#ff3377");
        return `
          <div class="sprunki-sprite-box">
            <svg class="sprunki-svg-character" viewBox="0 0 120 220">
              <path d="M45,130 Q40,180 30,220 L90,220 Q80,180 75,130 Z" fill="${bodyColor}" stroke="#111" stroke-width="4"/>
              <rect x="52" y="110" width="16" height="25" rx="5" fill="${bodyColor}" stroke="#111" stroke-width="3"/>
              <ellipse cx="60" cy="72" rx="44" ry="44" fill="${bodyColor}" stroke="#111" stroke-width="4.5"/>
            </svg>
            <img src="${char.image}" class="custom-oc-avatar-frame" style="border-color:${isHorror ? '#ff0033' : bodyColor};" alt="OC">
          </div>
        `;
      }

      // --- ホラー版の専用立ち絵グラフィック ---
      if (isHorror) {
        switch (char.id) {
          case "kick_snare": // Oren HORROR: 狂気スマイル・血走る黒瞳
            return `
              <svg class="sprunki-svg-character" viewBox="0 0 120 220">
                <!-- 破れたプロペラ -->
                <rect x="58" y="12" width="4" height="14" fill="#440008" stroke="#000" stroke-width="2"/>
                <polygon points="35,16 60,10 85,16 60,20" fill="#a4161a" stroke="#000" stroke-width="2"/>

    // --- ホラーモード切り替え処理 ---
    function toggleHorrorMode() {
      initAudio();
      isHorrorMode = !isHorrorMode;

      // 画面フラッシュ演出
      flashOverlay.classList.remove("flashing");
      void flashOverlay.offsetWidth;
      flashOverlay.classList.add("flashing");

      if (isHorrorMode) {
        document.body.classList.add("horror-mode");
        modeIcon.textContent = "🌈";
        modeText.textContent = "通常モードに戻る";
        paletteTitleText.textContent = "🩸 狂気のステージにキャラクターを立たせよう...";
        statusNote.textContent = "💀 ホラーモード起動中... 恐怖のサウンドが響き渡ります";
        showToast("💀 ホラーモード起動... 裏世界へようこそ");
      } else {
        document.body.classList.remove("horror-mode");
        modeIcon.textContent = "👁️";
        modeText.textContent = "ホラーモードへ変身";
        paletteTitleText.textContent = "🎨 キャラクターを選んでステージに立たせよう！";
        statusNote.textContent = "✨ ホラーモードボタンで恐怖の裏世界へ切り替え可能！";
        showToast("✨ 平和な通常モードに復帰しました");
      }

      renderStage();
      renderPalette();
    }

    modeToggleBtn.addEventListener("click", toggleHorrorMode);

    // --- BPM 切り替え機能 ---
    function setBPM(newBpm) {
      currentBPM = parseInt(newBpm, 10);
      bpmDisplay.textContent = `BPM ${currentBPM}`;

      bpmButtons.forEach(btn => {
        if (parseInt(btn.dataset.bpm, 10) === currentBPM) {
          btn.classList.add("active");
        } else {
          btn.classList.remove("active");
        }
      });

      const beatDurationSec = (60 / currentBPM);
      document.documentElement.style.setProperty('--beat-speed', `${beatDurationSec}s`);

      if (loopInterval) {
        clearInterval(loopInterval);
        loopInterval = setInterval(stepBeat, beatDurationSec * 1000);
      }

      showToast(`⚡ テンポを ${currentBPM} BPM に変更しました！`);
    }

    bpmButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        initAudio();
        setBPM(btn.dataset.bpm);
      });
    });

    // --- ステージ描画 ---
    function renderStage() {
      stageGrid.innerHTML = "";
      slotStates.forEach((slot, index) => {
        const slotEl = document.createElement("div");
        const isPlaced = !!slot.character;
        slotEl.className = `char-stand-slot ${isPlaced ? "bouncing" : "idle-standby"}`;
        slotEl.dataset.slotIndex = index;

        if (isPlaced) {
          const char = slot.character;
          slotEl.innerHTML = `
            <div class="stand-controls">
              <button class="stand-ctrl-btn mute ${slot.isMuted ? 'is-muted' : ''}" title="ミュート">
                ${slot.isMuted ? '🔇' : '🔊'}
              </button>
              <button class="stand-ctrl-btn remove" title="退場">✕</button>
            </div>
            <div class="sprunki-sprite-box">
              ${getSprunkiCharacterSVG(char, false, isHorrorMode)}
            </div>
            <div class="stand-name-label" style="border-color:${isHorrorMode ? '#ff0033' : (char.color || '#fff')}">${char.name}</div>
          `;

          slotEl.querySelector(".mute").addEventListener("click", (e) => {
            e.stopPropagation();
            slot.isMuted = !slot.isMuted;
            renderStage();
          });

          slotEl.querySelector(".remove").addEventListener("click", (e) => {
            e.stopPropagation();
            slot.character = null;
            renderStage();
          });
        } else {
          // 待機中キャラ
          slotEl.innerHTML = `
            <div class="sprunki-sprite-box">
              ${getSprunkiCharacterSVG(null, true, isHorrorMode)}
            </div>
            <div class="stand-name-label" style="opacity: 0.6;">枠 ${index + 1}</div>
          `;
        }

        // ドラッグ＆ドロップ対応
        slotEl.addEventListener("dragover", (e) => {
          e.preventDefault();
          slotEl.classList.add("drag-over");
        });
        slotEl.addEventListener("dragleave", () => {
          slotEl.classList.remove("drag-over");
        });
        slotEl.addEventListener("drop", (e) => {
          e.preventDefault();
          slotEl.classList.remove("drag-over");
          const charId = e.dataTransfer.getData("text/plain");
          const char = allCharacters.find(c => c.id === charId);
          if (char) {
            initAudio();
            slot.character = char;
            renderStage();
          }
        });

        stageGrid.appendChild(slotEl);
      });
    }

    // --- パレット描画 ---
    function renderPalette() {
      const cards = paletteGrid.querySelectorAll(".char-card");
      cards.forEach(c => c.remove());

      allCharacters.forEach(char => {
        const card = document.createElement("div");
        card.className = "char-card";
        card.draggable = true;
        card.dataset.charId = char.id;

        let actionButtonsHtml = "";
        if (!char.isDefault) {
          actionButtonsHtml = `
            <div class="char-card-actions">
              <button class="char-action-btn export" title="ファイルに保存 (.sprunki)">💾</button>
              <button class="char-action-btn delete" title="キャラを削除">🗑️</button>
            </div>
          `;
        }

        const iconDisplay = isHorrorMode ? (char.horrorIcon || char.icon || "💀") : (char.icon || "🌟");

        card.innerHTML = `
          <div class="char-card-type">${isHorrorMode ? 'HORROR' : (char.type || 'OC')}</div>
          ${actionButtonsHtml}
          <div class="char-card-icon" style="border-color: ${isHorrorMode ? '#ff0033' : (char.color || '#00f0ff')}">
            ${char.image ? `<img src="${char.image}" style="width:100%;height:100%;object-fit:contain;padding:2px;border-radius:12px;${isHorrorMode && char.id !== 'pbm70' ? 'filter:invert(0.85) hue-rotate(180deg);' : ''}">` : iconDisplay}
          </div>
          <div class="char-card-name">${char.name}</div>
        `;

        card.addEventListener("dragstart", (e) => {
          e.dataTransfer.setData("text/plain", char.id);
        });

        card.addEventListener("click", (e) => {
          if (e.target.closest(".char-action-btn")) return;
          initAudio();
          const firstEmpty = slotStates.find(s => !s.character);
          if (firstEmpty) {
            firstEmpty.character = char;
            renderStage();
          }
        });

        const exportBtn = card.querySelector(".export");
        if (exportBtn) {
          exportBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            exportCharacterToFile(char);
          });
        }

        const deleteBtn = card.querySelector(".delete");
        if (deleteBtn) {
          deleteBtn.addEventListener("click", async (e) => {
            e.stopPropagation();
            if (confirm(`キャラクター「${char.name}」を削除してもよろしいですか？`)) {
              await deleteCustomCharacter(char.id);
            }
          });
        }

        paletteGrid.appendChild(card);
      });
    }

    // --- キャラクターのファイルエクスポート ---
    function exportCharacterToFile(char) {
      let audioBase64 = "";
      if (char.rawAudioBuffer) {
        audioBase64 = arrayBufferToBase64(char.rawAudioBuffer);
      }

      const exportData = {
        sprunkiOC: true,
        version: 1,
        id: char.id,
        name: char.name,
        type: char.type || "OC",
        color: char.color,
        icon: char.icon,
        image: char.image || null,
        audioBase64: audioBase64,
        exportedAt: new Date().toISOString()
      };

      const jsonStr = JSON.stringify(exportData, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${char.name}_sprunki.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      showToast(`💾 「${char.name}」をファイル保存しました！`);
    }

    // --- キャラクターのファイルインポート ---
    async function importCharacterFile(file) {
      try {
        const text = await file.text();
        const data = JSON.parse(text);

        if (!data.sprunkiOC && !data.name) {
          throw new Error("スプランキーのキャラファイル形式ではありません。");
        }

        initAudio();
        let rawAudioBuffer = null;
        let decodedAudioBuffer = null;

        if (data.audioBase64) {
          rawAudioBuffer = base64ToArrayBuffer(data.audioBase64);
          decodedAudioBuffer = await audioCtx.decodeAudioData(rawAudioBuffer.slice(0));
        } else {
          decodedAudioBuffer = createDefaultSynthBuffer();
          rawAudioBuffer = audioBufferToWavArrayBuffer(decodedAudioBuffer);
        }

        const newOc = {
          id: "oc_" + Date.now() + "_" + Math.floor(Math.random() * 1000),
          name: data.name || "読込キャラ",
          type: "OC",
          color: data.color || "#" + Math.floor(Math.random()*16777215).toString(16),
          icon: data.icon || "🌟",
          image: data.image || null,
          rawAudioBuffer: rawAudioBuffer,
          audioBuffer: decodedAudioBuffer,
          createdAt: Date.now()
        };

        await dbSaveCharacter(newOc);
        customCharacters.push(newOc);
        allCharacters.push(newOc);
        renderPalette();

        showToast(`📂 キャラ「${newOc.name}」を読み込みました！`);
      } catch (err) {
        console.error(err);
        alert("キャラファイルの読み込みに失敗しました。正しいファイル形式か確認してください。");
      }
    }

    // --- キャラクターの削除 ---
    async function deleteCustomCharacter(id) {
      await dbDeleteCharacter(id);
      customCharacters = customCharacters.filter(c => c.id !== id);
      allCharacters = [...DEFAULT_CHARACTERS, ...customCharacters];

      slotStates.forEach(slot => {
        if (slot.character && slot.character.id === id) {
          slot.character = null;
        }
      });

      renderStage();
      renderPalette();
      showToast("🗑️ キャラクターを削除しました");
    }

    function createDefaultSynthBuffer() {
      const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.3, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < buffer.length; i++) {
        data[i] = Math.sin(i * 0.05) * Math.exp(-i / (audioCtx.sampleRate * 0.1));
      }
      return buffer;
    }

    // --- メインループ（通常 ＆ ホラーサウンド切り替え再生） ---
    function stepBeat() {
      if (!isPlaying) return;
      initAudio();

      const time = audioCtx.currentTime;
      const beatInBar = currentBeat % 4;

      dots.forEach((dot, i) => {
        if (i === beatInBar) dot.classList.add("active");
        else dot.classList.remove("active");
      });

      slotStates.forEach(slot => {
        if (slot.character && !slot.isMuted) {
          const char = slot.character;
          if (char.isDefault) {
            if (isHorrorMode && char.playHorror) {
              char.playHorror(time, currentBeat);
            } else if (char.playNormal) {
              char.playNormal(time, currentBeat);
            }
          } else if (char.audioBuffer) {
            // カスタムOCの音声（ホラー時は少し低速・ピッチシフト再生）
            const src = audioCtx.createBufferSource();
            src.buffer = char.audioBuffer;
            if (isHorrorMode) {
              src.playbackRate.setValueAtTime(0.75, time); // おどろおどろしい低速再生
            }
            src.connect(audioCtx.destination);
            src.start(time);
          }
        }
      });

      currentBeat++;
    }

    loopInterval = setInterval(stepBeat, (60 / currentBPM) * 1000);

    playPauseBtn.addEventListener("click", () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        initAudio();
        playIcon.textContent = "⏸️";
        playText.textContent = "一時停止";
      } else {
        playIcon.textContent = "▶️";
        playText.textContent = "再生";
        dots.forEach(d => d.classList.remove("active"));
      }
    });

    clearAllBtn.addEventListener("click", () => {
      slotStates.forEach(s => s.character = null);
      renderStage();
    });

    // --- 自作OC作成モーダル ＆ 録音処理 ---
    const ocModal = document.getElementById("ocModal");
    const openModalBtn = document.getElementById("openModalBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const saveOcBtn = document.getElementById("saveOcBtn");
    const ocNameInput = document.getElementById("ocName");
    const imageDropArea = document.getElementById("imageDropArea");
    const imageInput = document.getElementById("imageInput");
    const imagePreview = document.getElementById("imagePreview");
    const audioDropArea = document.getElementById("audioDropArea");
    const audioInput = document.getElementById("audioInput");
    const audioStatusText = document.getElementById("audioStatusText");
    const recBtn = document.getElementById("recBtn");
    const recBtnText = document.getElementById("recBtnText");
    const recStatus = document.getElementById("recStatus");
    const importOcBtn = document.getElementById("importOcBtn");
    const importFileInput = document.getElementById("importFileInput");

    let uploadedImageData = null;
    let customAudioBuffer = null;
    let customRawAudioBuffer = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    importOcBtn.addEventListener("click", () => importFileInput.click());
    importFileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        importCharacterFile(file);
      }
      importFileInput.value = "";
    });

    window.addEventListener("dragover", (e) => e.preventDefault());
    window.addEventListener("drop", (e) => {
      e.preventDefault();
      const files = e.dataTransfer.files;
      if (files && files.length > 0) {
        const file = files[0];
        if (file.name.endsWith(".json") || file.name.endsWith(".sprunki")) {
          importCharacterFile(file);
        }
      }
    });

    openModalBtn.addEventListener("click", () => {
      ocModal.classList.add("open");
      uploadedImageData = null;
      customAudioBuffer = null;
      customRawAudioBuffer = null;
      ocNameInput.value = "";
      imagePreview.style.display = "none";
      audioStatusText.textContent = "🎵 クリックして音楽/音声ファイルを選択 (MP3/WAV)";
      recStatus.textContent = "";
    });
    closeModalBtn.addEventListener("click", () => ocModal.classList.remove("open"));

    imageDropArea.addEventListener("click", () => imageInput.click());
    imageInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          uploadedImageData = event.target.result;
          imagePreview.src = uploadedImageData;
          imagePreview.style.display = "block";
        };
        reader.readAsDataURL(file);
      }
    });

    audioDropArea.addEventListener("click", () => audioInput.click());
    audioInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (file) {
        initAudio();
        customRawAudioBuffer = await file.arrayBuffer();
        customAudioBuffer = await audioCtx.decodeAudioData(customRawAudioBuffer.slice(0));
        audioStatusText.textContent = `✅ 音声読み込み完了: ${file.name}`;
      }
    });

    recBtn.addEventListener("click", async () => {
      initAudio();
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: "audio/wav" });
            customRawAudioBuffer = await audioBlob.arrayBuffer();
            customAudioBuffer = await audioCtx.decodeAudioData(customRawAudioBuffer.slice(0));
            recStatus.textContent = "🎉 録音完了！";
            audioStatusText.textContent = "✅ マイク録音の音声をセットしました";
          };

          mediaRecorder.start();
          isRecording = true;
          recBtn.classList.add("recording");
          recBtnText.textContent = "■ 録音停止";
          recStatus.textContent = "録音中...";
        } catch (err) {
          alert("マイクへのアクセスが許可されていません。");
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recBtn.classList.remove("recording");
        recBtnText.textContent = "🎙️ もう一度録音する";
      }
    });

    saveOcBtn.addEventListener("click", async () => {
      initAudio();
      const name = ocNameInput.value.trim() || "マイキャラ";

      if (!customAudioBuffer) {
        customAudioBuffer = createDefaultSynthBuffer();
        customRawAudioBuffer = audioBufferToWavArrayBuffer(customAudioBuffer);
      }

      const newOc = {
        id: "oc_" + Date.now(),
        name: name,
        type: "OC",
        color: "#" + Math.floor(Math.random()*16777215).toString(16),
        icon: "🌟",
        horrorIcon: "🩸",
        image: uploadedImageData,
        rawAudioBuffer: customRawAudioBuffer,
        audioBuffer: customAudioBuffer,
        createdAt: Date.now()
      };

      try {
        await dbSaveCharacter(newOc);
      } catch (err) {
        console.warn("IndexedDB save warning:", err);
      }

      customCharacters.push(newOc);
      allCharacters.push(newOc);

      renderPalette();
      ocModal.classList.remove("open");
      showToast(`✨ キャラ「${newOc.name}」を登録＆ブラウザ保存しました！`);
    });

    // --- アプリ初期化 ---
    async function initApp() {
      try {
        const savedOCs = await dbLoadCharacters();
        if (savedOCs && savedOCs.length > 0) {
          initAudio();
          for (const oc of savedOCs) {
            if (oc.rawAudioBuffer) {
              try {
                oc.audioBuffer = await audioCtx.decodeAudioData(oc.rawAudioBuffer.slice(0));
              } catch (e) {
                console.warn("Audio decode error for saved OC:", e);
                oc.audioBuffer = createDefaultSynthBuffer();
              }
            } else {
              oc.audioBuffer = createDefaultSynthBuffer();
            }
            customCharacters.push(oc);
          }
          allCharacters = [...DEFAULT_CHARACTERS, ...customCharacters];
        }
      } catch (err) {
        console.warn("IndexedDB load error:", err);
      }

      renderStage();
      renderPalette();
    }

    initApp();
  </script>
</body>
</html>
