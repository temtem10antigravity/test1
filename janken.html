<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✊✌️🖐️ じゃんけんゲーム 🌸</title>
  <meta name="description" content="コンピューターと楽しく勝負できるじゃんけんWebアプリ！">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 50%, #fbc2eb 100%);
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-shadow: 0 20px 40px rgba(100, 149, 237, 0.2);
      --text-main: #3d4a60;
      --text-muted: #7b889b;
      --win-color: #ff5d8f;
      --lose-color: #6c757d;
      --draw-color: #ffb703;
      --primary: #4361ee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text-main);
      position: relative;
      overflow-x: hidden;
    }

    /* 背景のふわふわ浮遊サークル */
    .floating-bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      filter: blur(10px);
      z-index: 0;
      animation: float 8s infinite ease-in-out alternate;
    }
    .bubble-1 { width: 150px; height: 150px; top: 8%; left: 8%; }
    .bubble-2 { width: 220px; height: 220px; bottom: 8%; right: 6%; animation-delay: 2s; }
    .bubble-3 { width: 100px; height: 100px; top: 70%; left: 12%; animation-delay: 4s; }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-30px) rotate(15deg); }
    }

    /* メインカード */
    .game-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 36px;
      padding: 32px 24px;
      box-shadow: var(--card-shadow);
      border: 3px solid rgba(255, 255, 255, 0.95);
      text-align: center;
    }

    /* 上部ナビ・トグル */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .nav-link {
      font-size: 0.85rem;
      font-weight: 700;
      color: #ff5d8f;
      text-decoration: none;
      background: #ffe4e8;
      padding: 6px 14px;
      border-radius: 20px;
      transition: all 0.2s;
    }
    .nav-link:hover {
      background: #ffccd5;
      transform: scale(1.05);
    }

    .sound-btn {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(200, 200, 200, 0.5);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 900;
      color: #2b3952;
      margin-bottom: 6px;
      letter-spacing: 0.05em;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    /* スコアボード */
    .score-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      background: #f4f8ff;
      padding: 14px;
      border-radius: 24px;
      margin-bottom: 24px;
      border: 2px solid #e0ecff;
    }

    .score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .score-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #7b889b;
      margin-bottom: 4px;
    }

    .score-value {
      font-size: 1.6rem;
      font-weight: 900;
    }

    .score-win { color: var(--win-color); }
    .score-lose { color: var(--lose-color); }
    .score-draw { color: var(--draw-color); }

    /* バトルステージ（対決エリア） */
    .battle-stage {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #ffffff;
      border-radius: 28px;
      padding: 24px 16px;
      border: 3px dashed #d5e5ff;
      box-shadow: 0 10px 25px rgba(200, 220, 255, 0.3);
      margin-bottom: 20px;
      position: relative;
    }

    .player-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .player-title {
      font-size: 0.9rem;
      font-weight: 900;
      margin-bottom: 8px;
      color: #64748b;
    }

    .hand-display {
      width: 90px;
      height: 90px;
      background: #f8fafc;
      border-radius: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3rem;
      border: 3px solid #e2e8f0;
      box-shadow: 0 6px 15px rgba(0,0,0,0.04);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .vs-badge {
      font-size: 1.2rem;
      font-weight: 900;
      color: #a0aec0;
      padding: 0 10px;
    }

    /* 手が回るアニメーション */
    .roulette {
      animation: spinHand 0.15s infinite linear;
    }

    @keyframes spinHand {
      0% { transform: scale(1.05) rotate(0deg); }
      50% { transform: scale(1.12) rotate(10deg); }
      100% { transform: scale(1.05) rotate(0deg); }
    }

    /* 結果ポップアップバナー */
    .result-banner {
      font-size: 1.5rem;
      font-weight: 900;
      padding: 12px 20px;
      border-radius: 20px;
      margin-bottom: 24px;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      background: #f8fafc;
      color: #64748b;
    }

    .result-win {
      background: #ffe3ec;
      color: #ff3366;
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(255, 51, 102, 0.2);
    }

    .result-lose {
      background: #e9ecef;
      color: #495057;
      transform: scale(0.98);
    }

    .result-draw {
      background: #fff3cd;
      color: #b07d00;
      transform: scale(1.02);
    }

    /* じゃんけん選択ボタン */
    .choices-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .choices-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .choice-btn {
      background: #ffffff;
      border: 3px solid #e0ecff;
      border-radius: 24px;
      padding: 16px 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 18px rgba(67, 97, 238, 0.12);
      font-family: inherit;
    }

    .choice-btn .hand-emoji {
      font-size: 2.6rem;
      transition: transform 0.2s;
    }

    .choice-btn .hand-name {
      font-size: 1rem;
      font-weight: 900;
      color: var(--text-main);
    }

    .choice-btn:hover {
      transform: translateY(-6px) scale(1.05);
      border-color: #4361ee;
      box-shadow: 0 12px 25px rgba(67, 97, 238, 0.25);
    }

    .choice-btn:active {
      transform: translateY(2px) scale(0.95);
    }

    .choice-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* リセットボタン */
    .reset-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 20px;
      text-decoration: underline;
      transition: color 0.2s;
    }
    .reset-btn:hover {
      color: #475569;
    }

    /* 紙吹雪Canvas */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>

  <div class="floating-bubble bubble-1"></div>
  <div class="floating-bubble bubble-2"></div>
  <div class="floating-bubble bubble-3"></div>

  <canvas id="confettiCanvas"></canvas>

  <main class="game-card">
    <div class="top-bar">
      <a href="index.html" class="nav-link">🏠 ホームへ戻る</a>
      <button class="sound-btn" id="soundBtn">🔊 サウンド: ON</button>
    </div>

    <h1>✊✌️🖐️ じゃんけんバトル</h1>
    <p class="subtitle">好きな手を選んで勝負しよう！</p>

    <!-- スコアボード -->
    <section class="score-board">
      <div class="score-item">
        <span class="score-label">👑 勝ち</span>
        <span class="score-value score-win" id="winCount">0</span>
      </div>
      <div class="score-item">
        <span class="score-label">💀 負け</span>
        <span class="score-value score-lose" id="loseCount">0</span>
      </div>
      <div class="score-item">
        <span class="score-label">🤝 あいこ</span>
        <span class="score-value score-draw" id="drawCount">0</span>
      </div>
    </section>

    <!-- 対戦ステージ -->
    <section class="battle-stage">
      <div class="player-box">
        <span class="player-title">あなた (YOU)</span>
        <div class="hand-display" id="playerHand">❓</div>
      </div>
      <div class="vs-badge">VS</div>
      <div class="player-box">
        <span class="player-title">あいて (CPU)</span>
        <div class="hand-display" id="cpuHand">❓</div>
      </div>
    </section>

    <!-- 勝敗結果バナー -->
    <div class="result-banner" id="resultBanner">
      手を選んでね！
    </div>

    <!-- じゃんけんボタン -->
    <div class="choices-title">どれを出す？</div>
    <div class="choices-grid">
      <button class="choice-btn" data-hand="rock" id="btnRock">
        <span class="hand-emoji">✊</span>
        <span class="hand-name">グー</span>
      </button>
      <button class="choice-btn" data-hand="scissors" id="btnScissors">
        <span class="hand-emoji">✌️</span>
        <span class="hand-name">チョキ</span>
      </button>
      <button class="choice-btn" data-hand="paper" id="btnPaper">
        <span class="hand-emoji">🖐️</span>
        <span class="hand-name">パー</span>
      </button>
    </div>

    <button class="reset-btn" id="resetBtn">スコアをリセットする</button>
  </main>

  <script>
    // 手のデータ定義
    const HANDS = {
      rock: { name: "グー", emoji: "✊" },
      scissors: { name: "チョキ", emoji: "✌️" },
      paper: { name: "パー", emoji: "🖐️" }
    };
    const HAND_KEYS = ["rock", "scissors", "paper"];

    // スコア状態
    let wins = 0;
    let loses = 0;
    let draws = 0;
    let isPlaying = false;
    let soundEnabled = true;

    // DOM要素
    const winCountEl = document.getElementById("winCount");
    const loseCountEl = document.getElementById("loseCount");
    const drawCountEl = document.getElementById("drawCount");
    const playerHandEl = document.getElementById("playerHand");
    const cpuHandEl = document.getElementById("cpuHand");
    const resultBannerEl = document.getElementById("resultBanner");
    const choiceButtons = document.querySelectorAll(".choice-btn");
    const resetBtn = document.getElementById("resetBtn");
    const soundBtn = document.getElementById("soundBtn");

    // 効果音（Web Audio API）
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playTone(freq, type, duration, delay = 0) {
      if (!soundEnabled) return;
      initAudio();
      setTimeout(() => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      }, delay * 1000);
    }

    function playSound(type) {
      if (!soundEnabled) return;
      if (type === "click") {
        playTone(440, "sine", 0.08);
      } else if (type === "win") {
        playTone(523.25, "triangle", 0.15, 0);   // C5
        playTone(659.25, "triangle", 0.15, 0.1); // E5
        playTone(783.99, "triangle", 0.15, 0.2); // G5
        playTone(1046.5, "triangle", 0.4, 0.3);  // C6
      } else if (type === "lose") {
        playTone(392.00, "sawtooth", 0.2, 0);    // G4
        playTone(349.23, "sawtooth", 0.2, 0.15); // F4
        playTone(311.13, "sawtooth", 0.4, 0.3);  // Eb4
      } else if (type === "draw") {
        playTone(440, "sine", 0.12, 0);
        playTone(440, "sine", 0.2, 0.15);
      }
    }

    // サウンドON/OFF
    soundBtn.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? "🔊 サウンド: ON" : "🔇 サウンド: OFF";
    });

    // じゃんけん勝敗判定
    function judge(player, cpu) {
      if (player === cpu) return "draw";
      if (
        (player === "rock" && cpu === "scissors") ||
        (player === "scissors" && cpu === "paper") ||
        (player === "paper" && cpu === "rock")
      ) {
        return "win";
      }
      return "lose";
    }

    // じゃんけん実行
    function playGame(playerChoice) {
      if (isPlaying) return;
      isPlaying = true;
      playSound("click");

      // ボタンを一時無効化
      choiceButtons.forEach(b => b.disabled = true);

      // あなたの手を即座に表示
      playerHandEl.textContent = HANDS[playerChoice].emoji;
      playerHandEl.style.transform = "scale(1.15)";
      setTimeout(() => playerHandEl.style.transform = "scale(1)", 200);

      // CPUの手をルーレットで回す演出
      cpuHandEl.classList.add("roulette");
      resultBannerEl.className = "result-banner";
      resultBannerEl.textContent = "じゃん・けん・・・";

      let rouletteIndex = 0;
      const interval = setInterval(() => {
        cpuHandEl.textContent = HANDS[HAND_KEYS[rouletteIndex % 3]].emoji;
        rouletteIndex++;
      }, 80);

      // 0.8秒後に決定
      setTimeout(() => {
        clearInterval(interval);
        cpuHandEl.classList.remove("roulette");

        // CPUの手をランダム決定
        const cpuChoice = HAND_KEYS[Math.floor(Math.random() * HAND_KEYS.length)];
        cpuHandEl.textContent = HANDS[cpuChoice].emoji;
        cpuHandEl.style.transform = "scale(1.2)";
        setTimeout(() => cpuHandEl.style.transform = "scale(1)", 200);

        // 勝敗判定
        const result = judge(playerChoice, cpuChoice);

        if (result === "win") {
          wins++;
          winCountEl.textContent = wins;
          resultBannerEl.className = "result-banner result-win";
          resultBannerEl.textContent = "🎉 あなたの勝ち！やったね！";
          playSound("win");
          launchConfetti();
        } else if (result === "lose") {
          loses++;
          loseCountEl.textContent = loses;
          resultBannerEl.className = "result-banner result-lose";
          resultBannerEl.textContent = "😢 まけちゃった…もう一回！";
          playSound("lose");
        } else {
          draws++;
          drawCountEl.textContent = draws;
          resultBannerEl.className = "result-banner result-draw";
          resultBannerEl.textContent = "🤝 あいこで…しょ！";
          playSound("draw");
        }

        // ボタン復帰
        choiceButtons.forEach(b => b.disabled = false);
        isPlaying = false;
      }, 800);
    }

    // ボタンイベント
    choiceButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const hand = btn.getAttribute("data-hand");
        playGame(hand);
      });
    });

    // スコアリセット
    resetBtn.addEventListener("click", () => {
      if (confirm("スコアをリセットしますか？")) {
        wins = 0;
        loses = 0;
        draws = 0;
        winCountEl.textContent = "0";
        loseCountEl.textContent = "0";
        drawCountEl.textContent = "0";
        playerHandEl.textContent = "❓";
        cpuHandEl.textContent = "❓";
        resultBannerEl.className = "result-banner";
        resultBannerEl.textContent = "手を選んでね！";
      }
    });

    // --- 紙吹雪エフェクト ---
    const canvas = document.getElementById("confettiCanvas");
    const ctx = canvas.getContext("2d");
    let confettiParticles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const CONFETTI_COLORS = ["#ff5d8f", "#ffd166", "#06d6a0", "#118ab2", "#e0c3fc", "#4361ee"];

    function launchConfetti() {
      confettiParticles = [];
      for (let i = 0; i < 60; i++) {
        confettiParticles.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 80,
          y: canvas.height / 2,
          r: Math.random() * 6 + 4,
          dx: (Math.random() - 0.5) * 10,
          dy: (Math.random() - 1.2) * 10 - 3,
          color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 10,
          opacity: 1
        });
      }
      requestAnimationFrame(updateConfetti);
    }

    function updateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let alive = false;

      confettiParticles.forEach(p => {
        p.x += p.dx;
        p.y += p.dy;
        p.dy += 0.35;
        p.dx *= 0.98;
        p.rotation += p.rotSpeed;
        p.opacity -= 0.015;

        if (p.opacity > 0) {
          alive = true;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.opacity;
          ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.5);
          ctx.restore();
        }
      });

      if (alive) requestAnimationFrame(updateConfetti);
      else ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  </script>
</body>
</html>
